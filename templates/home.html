{% extends "base.html" %}
{% block title %}야놀까? | 약속 정하기{% endblock %}
{% block content %}
<section class="welcome brand-welcome">
    <p class="platform-label">약속 정하기 플랫폼</p>
    <h1 class="brand-title">야놀까?</h1>
    <p>날짜부터 놀거리까지, 친구들과 한 번에 정해보세요.</p>
</section>

<div class="home-actions" role="tablist">
    <button class="home-action create-action" type="button" data-panel="create-panel">
        <span class="action-symbol">+</span>
        <strong>방 만들기</strong>
        <small>새로운 약속 시작</small>
    </button>
    <button class="home-action join-action" type="button" data-panel="join-panel">
        <span class="action-symbol">→</span>
        <strong>방 입장하기</strong>
        <small>초대받은 방 참여</small>
    </button>
</div>

<section id="create-panel" class="mode-panel home-form-panel">
    <div class="panel-heading">
        <button type="button" class="panel-back" aria-label="처음 화면으로 돌아가기">←</button>
        <div><p>새 약속</p><h2>방 만들기</h2></div>
    </div>
    <form method="post" action="{{ url_for('create_room') }}" class="form-stack">
        <div class="field-grid two">
            <label>
                <span>방장 이름</span>
                <input name="host_name" maxlength="30" required placeholder="예: 김민지">
            </label>
            <label>
                <span>방 이름</span>
                <input name="title" maxlength="80" required placeholder="예: 여름방학 동기 모임">
            </label>
        </div>
        <label>
            <span>방 기본 정보</span>
            <textarea name="description" maxlength="300" rows="3" placeholder="예: 서울에서 하루 놀기, 총 4명"></textarea>
        </label>
        <div class="field-grid two">
            <label>
                <span>후보 시작일</span>
                <input type="date" name="start_date" required>
            </label>
            <label>
                <span>후보 종료일</span>
                <input type="date" name="end_date" required>
            </label>
        </div>
        <button class="primary-button" type="submit">방 만들기</button>
    </form>
</section>

<section id="join-panel" class="mode-panel home-form-panel">
    <div class="panel-heading">
        <button type="button" class="panel-back" aria-label="처음 화면으로 돌아가기">←</button>
        <div><p>초대받은 약속</p><h2>방 입장하기</h2></div>
    </div>
    <form method="post" action="{{ url_for('join_room') }}" class="form-stack narrow-form">
        <label>
            <span>초대코드</span>
            <input class="code-input" name="code" maxlength="6" required value="{{ join_code }}" placeholder="6자리 코드">
        </label>
        <label>
            <span>사용자 이름</span>
            <input name="name" maxlength="30" required placeholder="방 안에서 표시할 이름">
        </label>
        <button class="primary-button" type="submit">입장하기</button>
    </form>
</section>
{% endblock %}
