services:
  - type: web
    name: team-meeting-room
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team-meeting-db
          property: connectionString
      - key: RECOMMENDER_URL
        value: http://64.110.80.116:8501

databases:
  - name: team-meeting-db
    plan: free
    databaseName: team_meeting
    user: team_meeting_user
